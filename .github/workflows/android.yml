name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf app extracted
          mkdir -p app extracted
          unzip -q cabinet-color-ai-github.zip -d extracted

          PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project folder not found"
            exit 1
          fi

          cp -r "$PROJECT_DIR"/. app/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Build APK
        run: flutter build apk --release
        working-directory: app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-color-ai-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
